
name: DB Connection Check – München → Aachen

on:
  schedule:
    # Once daily at 07:17 UTC = 08:17 German winter time
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-connections:
    name: Check DB connections
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # ==========================================
      # CONFIGURATION: Change your trip here
      # ==========================================
      FROM_STATION: "München Hbf"
      FROM_ID: "8000261"
      TO_STATION: "Aachen Hbf"
      TO_ID: "8000001"
      TRAVEL_DATE: "2026-12-18"

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check DB connections
        id: check
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const API = "https://v6.db.transport.rest";
          const fromName = process.env.FROM_STATION;
          const toName = process.env.TO_STATION;
          const fromId = process.env.FROM_ID;
          const toId = process.env.TO_ID;
          const date = process.env.TRAVEL_DATE;

          function setOutput(key, value) {
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `${key}=${value}\n`
            );
          }

          function setMultilineOutput(key, value) {
            const delimiter = `END_${key}_VALUE`;
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `${key}<<${delimiter}\n${value}\n${delimiter}\n`
            );
          }

          function validDate(value) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
            const d = new Date(`${value}T12:00:00Z`);
            return d.toISOString().slice(0, 10) === value;
          }

          function berlinOffset(date, hour) {
            const utcGuess = new Date(
              `${date}T${String(hour).padStart(2, "0")}:00:00Z`
            );

            const parts = new Intl.DateTimeFormat("en-GB", {
              timeZone: "Europe/Berlin",
              timeZoneName: "longOffset"
            }).formatToParts(utcGuess);

            return (
              parts.find(p => p.type === "timeZoneName")?.value
                || "GMT+01:00"
            ).replace("GMT", "") || "+00:00";
          }

          async function getJson(url) {
            const maxAttempts = 4;

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              try {
                const response = await fetch(url, {
                  headers: {
                    "user-agent": "GitHubActions-DB-Connection-Check/1.0",
                    "accept": "application/json"
                  },
                  signal: AbortSignal.timeout(20000)
                });

                if (!response.ok) {
                  const retryable =
                    response.status === 429 || response.status >= 500;

                  if (!retryable || attempt === maxAttempts) {
                    throw new Error(`API HTTP ${response.status}`);
                  }

                  const retryAfter = Number(
                    response.headers.get("retry-after")
                  );

                  const waitMs = Number.isFinite(retryAfter) &&
                    retryAfter > 0
                    ? Math.min(retryAfter * 1000, 30000)
                    : attempt * 3000;

                  console.log(
                    `HTTP ${response.status}; retry ${attempt + 1}/` +
                    `${maxAttempts} in ${waitMs} ms`
                  );

                  await new Promise(r => setTimeout(r, waitMs));
                  continue;
                }

                return await response.json();

              } catch (error) {
                if (attempt === maxAttempts) throw error;

                const waitMs = attempt * 3000;

                console.log(
                  `Request failed: ${error.message}; retry ` +
                  `${attempt + 1}/${maxAttempts} in ${waitMs} ms`
                );

                await new Promise(r => setTimeout(r, waitMs));
              }
            }

            throw new Error("Request failed after all retries");
          }

          async function main() {
            if (!validDate(date)) {
              throw new Error(`Invalid travel date: ${date}`);
            }

            const found = new Map();
            const errors = [];
            let successfulQueries = 0;

            // Eight departure times to sample the whole day.
            for (const hour of [0, 3, 6, 9, 12, 15, 18, 21]) {
              const localTime =
                `${date}T${String(hour).padStart(2, "0")}:00:00`;
              const departure =
                `${localTime}${berlinOffset(date, hour)}`;

              const url = new URL(`${API}/journeys`);
              url.searchParams.set("from", fromId);
              url.searchParams.set("to", toId);
              url.searchParams.set("departure", departure);
              url.searchParams.set("results", "15");
              url.searchParams.set("language", "de");

              try {
                const data = await getJson(url);

                if (!Array.isArray(data.journeys)) {
                  throw new Error("Unexpected API response");
                }

                successfulQueries++;

                for (const journey of data.journeys) {
                  const legs = (journey.legs || []).filter(
                    leg => leg.departure && leg.arrival
                  );

                  if (legs.length === 0) continue;
                  if (!legs[0].departure.startsWith(date)) continue;

                  const first = legs[0];
                  const last = legs[legs.length - 1];

                  const key = `${first.departure}|${last.arrival}`;

                  found.set(key, {
                    departure: first.departure,
                    arrival: last.arrival
                  });
                }

              } catch (error) {
                errors.push(`${hour}:00 - ${error.message}`);
              }

              // Keep requests spaced out.
              await new Promise(r => setTimeout(r, 1500));
            }

            // No result is trustworthy if every request failed.
            if (successfulQueries === 0) {
              throw new Error(
                "All journey searches failed:\n" + errors.join("\n")
              );
            }

            // If there were errors and no journeys, don't incorrectly
            // report that no connections exist.
            if (found.size === 0 && errors.length > 0) {
              throw new Error(
                "Check incomplete; some API queries failed and no " +
                "connections were found in the remaining queries:\n" +
                errors.join("\n")
              );
            }

            if (found.size === 0) {
              console.log(
                `NO CONNECTIONS FOUND: ${fromName} -> ${toName} on ${date}`
              );

              setOutput("found", "false");
              setOutput("count", "0");

              fs.appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                `# DB Connection Check\n\n` +
                `**Result: NO**\n\n` +
                `Route: ${fromName} -> ${toName}\n\n` +
                `Date: ${date}\n\n` +
                `No connections found in ${successfulQueries} successful searches.\n`
              );

              return;
            }

            const connections = [...found.values()].sort(
              (a, b) => a.departure.localeCompare(b.departure)
            );

            const details = connections.map(c =>
              `${c.departure} -> ${c.arrival}`
            ).join("\n");

            console.log(`YES: Found ${connections.length} connection(s).`);
            console.log(details);

            if (errors.length > 0) {
              console.warn(
                "Some searches failed, but connections were found:",
                errors
              );
            }

            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              `# DB Connection Check\n\n` +
              `**Result: YES**\n\n` +
              `Route: ${fromName} -> ${toName}\n\n` +
              `Date: ${date}\n\n` +
              `Connections found: ${connections.length}\n\n` +
              connections.map(c =>
                `- ${c.departure} -> ${c.arrival}`
              ).join("\n") + "\n"
            );

            setOutput("found", "true");
            setOutput("count", String(connections.length));
            setMultilineOutput("details", details);
          }

          main().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Send email when connections are found
        if: success() && steps.check.outputs.found == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.resend.com
          server_port: 465
          secure: true
          username: resend
          password: ${{ secrets.RESEND_API_KEY }}
          subject: "🚆 DB connections found – München → Aachen – ${{ env.TRAVEL_DATE }}"
          to: der.baumann@t-online.de
          from: "DB Monitor <onboarding@resend.dev>"
          body: |
            Good news! Connections were found.

            Route: ${{ env.FROM_STATION }} -> ${{ env.TO_STATION }}
            Travel date: ${{ env.TRAVEL_DATE }}
            Number of connections: ${{ steps.check.outputs.count }}

            Connections:
            ${{ steps.check.outputs.details }}

            Check the journey search:
            https://www.bahn.de/

            Workflow run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
