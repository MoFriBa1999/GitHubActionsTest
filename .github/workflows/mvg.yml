name: S5 Delay Check – Höhenkirchen → Marienplatz

on:
  schedule:
    - cron: "0,30 13-18 * * 1-5"

  workflow_dispatch:               # allow manual trigger from Actions tab
  push:                            # run on every push to the repository

jobs:
  check-sbahn:
    name: Check S5 delay
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install mvg aiohttp tzdata

      - name: Run S5 delay check
        id: delay_check
        # Script exits with code 1 on delay ≥ 5 min or cancellation → job fails
        run: python mvg_check.py

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.resend.com
          server_port: 465
          secure: true
          username: resend
          password: ${{ secrets.RESEND_API_KEY }}
          subject: "🚨 S5 disrupted – Höhenkirchen-Siegertsbrunn"
          to: mofriba@gmail.com
          from: "S5 Monitor <onboarding@resend.dev>"
          body: |
            ⚠️ The S5 from Höhenkirchen-Siegertsbrunn has a delay of 5+ minutes or a cancellation.

            Check the full run log here:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            – Your S5 Monitor 🚆
